name: dev bread-theme

# Publishes a dev-track build on every push to `main` (the trunk branch;
# there is no separate `dev` branch). See docs/release-channels.md for the
# release-track policy this is part of.
on:
  push:
    branches: ['main']
    paths:
      - 'bread-theme/**'
      # The bread-theme binary's `extract` feature (below) links this
      # crate in: a bread-palette-extract-only change must still publish a
      # new bread-theme dev build.
      - 'bread-palette-extract/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.forgejo/workflows/dev-bread-theme.yml'

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        shell: bash
        run: |
          set -euo pipefail
          # Inline bootstrap of scripts/ci-checkout.sh (see docs/ci-checkout.md);
          # keep this block in sync with that helper. Checks out the exact
          # event commit into a directory this job owns.
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "checkout: GITHUB_SHA is not a full commit id" >&2
              exit 1
          fi
          checkout=$(mktemp -d "${RUNNER_TEMP:-/tmp}/bread-ci.XXXXXX")
          printf 'BREAD_CI_JOB_DIR=%s\n' "$checkout" >> "$GITHUB_ENV"
          git clone --no-checkout "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "$checkout/src"
          git -C "$checkout/src" -c advice.detachedHead=false checkout --quiet --detach "$GITHUB_SHA"
          actual="$(git -C "$checkout/src" rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
              echo "checkout: HEAD is $actual, expected $GITHUB_SHA" >&2
              exit 1
          fi

      - name: build
        run: cd "$BREAD_CI_JOB_DIR/src" && cargo build --release --locked -p bread-theme --bin bread-theme --features extract

      - name: compute dev version
        run: |
          set -euo pipefail
          cd "$BREAD_CI_JOB_DIR/src"
          # Base the dev version off the latest published stable tag,
          # not Cargo.toml: Cargo.toml can go stale relative to the last
          # real release (seen in practice: breadbox/breadpad/breadcrumbs/
          # breadpaper), which would make a dev build sort as OLDER than
          # what's already installed and bakery would correctly refuse it.
          LATEST_TAG="$(git ls-remote --tags --refs \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" 'v*' \
            | awk -F/ '{print $NF}' | sed 's/^v//' | (grep -v -- '-' || true) | sort -V | tail -1)"
          if [ -n "${LATEST_TAG}" ]; then
            CUR="${LATEST_TAG}"
          else
            CUR="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          fi
          IFS='.' read -r MA MI PA <<< "${CUR}"
          SHA="$(git rev-parse --short HEAD)"
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "VERSION=${MA}.${MI}.$((PA + 1))-dev.${TS}+${SHA}" >> "$GITHUB_ENV"

      - name: prepare artifacts
        run: |
          set -euo pipefail
          PKG_DIR="/srv/breadway-dl/dev/bread-theme/${VERSION}"
          mkdir -p "${PKG_DIR}"
          cp "$BREAD_CI_JOB_DIR/src/target/release/bread-theme" "${PKG_DIR}/bread-theme-x86_64"
          strip "${PKG_DIR}/bread-theme-x86_64"
          sha256sum "${PKG_DIR}/bread-theme-x86_64" | awk '{print $1}' \
            > "${PKG_DIR}/bread-theme-x86_64.sha256"
          cp "$BREAD_CI_JOB_DIR/src/bread-theme/bakery.toml" "${PKG_DIR}/bakery.toml"
          cp "$BREAD_CI_JOB_DIR/src/bread-theme/LICENSE" "${PKG_DIR}/LICENSE"
          ln -sfn "${VERSION}" "/srv/breadway-dl/dev/bread-theme/latest"

      - name: sign dev binary
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          PKG_DIR="/srv/breadway-dl/dev/bread-theme/${VERSION}"
          if [ -n "${MINISIGN_SEC_KEY:-}" ]; then
            minisign -W -S -s "${MINISIGN_SEC_KEY}" -m "${PKG_DIR}/bread-theme-x86_64" \
              -x "${PKG_DIR}/bread-theme-x86_64.minisig" </dev/null
            echo "signed bread-theme-x86_64"
          else
            echo "::warning::BAKERY_MINISIGN_SEC_KEY_PATH not set: shipping bread-theme-x86_64 UNSIGNED"
          fi

      - name: regenerate dev index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
          TRACK: dev
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set: refusing to regenerate dev index.json unsigned (would leave a stale signature mismatched against fresh content and break bakery for everyone on the dev track)"
            exit 1
          fi
          cd "$BREAD_CI_JOB_DIR/src" && bash scripts/gen-index.sh

      # Runs last so no earlier step loses its tree. Removes only this job's
      # own checkout directory, and only under RUNNER_TEMP.
      - name: clean owned checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BREAD_CI_JOB_DIR:-}" == "${RUNNER_TEMP:-/tmp}"/bread-ci.* && -d "$BREAD_CI_JOB_DIR" ]]; then
            rm -rf -- "$BREAD_CI_JOB_DIR"
          fi
