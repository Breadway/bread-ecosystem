name: check

# Lint + test on short-lived work branches AND on `main`: a push to `main`
# triggers a dev-track publish (dev-bakery.yml / dev-bread-theme.yml), and
# those only run `cargo build --bin`, so without this nothing here is ever
# clippy'd or tested in CI. The `--features gtk` pass matters: the entire
# per-monitor GTK bind module in bread-theme is gated behind it and would
# otherwise never compile in CI, let alone run its tests.
#
# The tree was normalised with a dedicated `cargo fmt --all` commit (see
# .git-blame-ignore-revs), so fmt is now gated too.
#
# This repo has its own cross-repo git dependency (bread-utils -> bread-shared
# from Breadway/bread), so it runs the same pin-lint every downstream
# consumer runs: see scripts/lint-pins.sh and docs/release-channels.md
# (part of ECO-38's dev-track/tag-pin split).
#
# The `--features extract` pass matters too: bread-theme's native palette
# extraction (`palette_from_image`, `pywal_colors`, `generate_output`, and
# the bread-palette-extract dependency itself) is gated behind it and would
# otherwise never compile or run its tests in CI (ECO-30/ECO-33).
on:
  push:
    branches: ['feature/**', 'fix/**', 'main']

jobs:
  check:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: lint git.breadway.dev dependency pins
        run: cd src && bash scripts/lint-pins.sh

      - name: shared CI target cache locking
        run: cd src && bash ci/test-build-lock.sh

      - name: breadbug symbol publisher
        run: cd src && bash scripts/test-publish-symbols.sh

      - name: fmt
        run: cd src && cargo fmt --all -- --check

      - name: clippy
        run: cd src && cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: clippy (gtk)
        run: cd src && cargo clippy --workspace --all-targets --locked --features gtk -- -D warnings

      - name: clippy (extract)
        run: cd src && cargo clippy --workspace --all-targets --locked --features extract -- -D warnings

      - name: test
        run: cd src && cargo test --workspace --locked

      - name: test (gtk)
        run: cd src && cargo test --workspace --locked --features gtk

      - name: test (extract)
        run: cd src && cargo test --workspace --locked --features extract

      - name: build --locked (extract)
        run: cd src && cargo build --workspace --locked --features extract
