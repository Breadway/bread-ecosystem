name: check

# Lint + test on short-lived work branches AND on `main`: a push to `main`
# triggers a dev-track publish (dev-bakery.yml / dev-bread-theme.yml), and
# those only run `cargo build --bin`, so without this nothing here is ever
# clippy'd or tested in CI. The `--features gtk` pass matters: the entire
# per-monitor GTK bind module in bread-theme is gated behind it and would
# otherwise never compile in CI, let alone run its tests.
#
# The tree was normalised with a dedicated `cargo fmt --all` commit (see
# .git-blame-ignore-revs), so fmt is now gated too.
#
# This repo has its own cross-repo git dependency (bread-utils -> bread-shared
# from Breadway/bread), so it runs the same pin-lint every downstream
# consumer runs: see scripts/lint-pins.sh and docs/release-channels.md
# (part of ECO-38's dev-track/tag-pin split).
#
# The `--features extract` pass matters too: bread-theme's native palette
# extraction (`palette_from_image`, `pywal_colors`, `generate_output`, and
# the bread-palette-extract dependency itself) is gated behind it and would
# otherwise never compile or run its tests in CI (ECO-30/ECO-33).
on:
  push:
    branches: ['feature/**', 'fix/**', 'main']

jobs:
  check:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        shell: bash
        run: |
          set -euo pipefail
          # Bootstrap: scripts/ci-checkout.sh lives in the tree being fetched, so
          # it cannot run before this clone. This inline copy must match it.
          # Consumers that adopt the shared helper should fetch a pinned copy
          # first (see docs/ci-checkout.md) and drop this block.
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "checkout: GITHUB_SHA is not a full commit id" >&2
              exit 1
          fi
          checkout=$(mktemp -d "${RUNNER_TEMP:-/tmp}/ecosystem-check.XXXXXX")
          printf 'ECO_CHECK_SRC=%s\n' "$checkout" >> "$GITHUB_ENV"
          git clone --no-checkout "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "$checkout"
          git -C "$checkout" -c advice.detachedHead=false checkout --quiet --detach "$GITHUB_SHA"
          actual="$(git -C "$checkout" rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
              echo "checkout: HEAD is $actual, expected $GITHUB_SHA" >&2
              exit 1
          fi

      - name: lint git.breadway.dev dependency pins
        run: cd "$ECO_CHECK_SRC" && bash scripts/lint-pins.sh

      - name: ci checkout helper regression
        run: cd "$ECO_CHECK_SRC" && bash scripts/test-ci-checkout.sh

      - name: shared CI target cache locking
        run: cd "$ECO_CHECK_SRC" && bash ci/test-build-lock.sh

      - name: breadbug symbol publisher
        run: cd "$ECO_CHECK_SRC" && bash scripts/test-publish-symbols.sh

      - name: fmt
        run: cd "$ECO_CHECK_SRC" && cargo fmt --all -- --check

      - name: clippy
        run: cd "$ECO_CHECK_SRC" && cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: clippy (gtk)
        run: cd "$ECO_CHECK_SRC" && cargo clippy --workspace --all-targets --locked --features gtk -- -D warnings

      - name: clippy (extract)
        run: cd "$ECO_CHECK_SRC" && cargo clippy --workspace --all-targets --locked --features extract -- -D warnings

      - name: test
        run: cd "$ECO_CHECK_SRC" && cargo test --workspace --locked

      - name: test (gtk)
        run: cd "$ECO_CHECK_SRC" && cargo test --workspace --locked --features gtk

      - name: test (extract)
        run: cd "$ECO_CHECK_SRC" && cargo test --workspace --locked --features extract

      - name: build --locked (extract)
        run: cd "$ECO_CHECK_SRC" && cargo build --workspace --locked --features extract

      - name: clean owned checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ECO_CHECK_SRC:-}" == "${RUNNER_TEMP:-/tmp}"/ecosystem-check.* && -d "$ECO_CHECK_SRC" ]]; then
            rm -rf -- "$ECO_CHECK_SRC"
          fi
