name: Build and publish package

on:
  push:
    tags: ['v*']

jobs:
  package:
    # PKGBUILD pkgver cannot contain `-`; skip RC tags the same way
    # release-bakery.yml does.
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: [self-hosted]
    container:
      image: archlinux:latest
    steps:
      # Note: no actions/checkout: the archlinux image has no Node, which JS
      # actions require. Everything runs as shell steps and clones manually.
      - name: Build and publish
        env:
          PUBLISH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          pacman -Syu --noconfirm base-devel git rust cargo
          useradd -m builder
          git config --global --add safe.directory '*'
          helper_commit=c6442cabb6c02acd1380dcd0d17189c4e22def03
          helper_sha256=39d07ff4efe2336fe5eac1f1099590d5427e04111e0f51fc3f905df2cfbd205f
          helper=$(mktemp "${RUNNER_TEMP:-/tmp}/ci-checkout.XXXXXX")
          trap 'rm -f -- "$helper"' EXIT
          curl -fsSL "https://git.breadway.dev/Breadway/bread-ecosystem/raw/commit/${helper_commit}/scripts/ci-checkout.sh" -o "$helper"
          printf '%s  %s\n' "$helper_sha256" "$helper" | sha256sum --check
          bash "$helper" "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA" /home/builder/src
          cd /home/builder/src
          git archive --format=tar.gz --prefix="bakery-${VERSION}/" HEAD \
            > packaging/arch/bakery-${VERSION}.tar.gz
          SHA=$(sha256sum packaging/arch/bakery-${VERSION}.tar.gz | awk '{print $1}')
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" packaging/arch/PKGBUILD
          chown -R builder:builder /home/builder/src
          # --nocheck: packaging builds the artifact; tests belong in a CI job.
          su builder -c "cd /home/builder/src/packaging/arch && makepkg -f --noconfirm --nocheck"
          PKG=$(find /home/builder/src/packaging/arch -name '*.pkg.tar.zst' | head -1)
          curl -fsS -X PUT \
            -H "Authorization: token ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${PKG}" \
            "https://git.breadway.dev/api/packages/Breadway/arch/os"
