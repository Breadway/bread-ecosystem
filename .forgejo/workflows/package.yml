name: Build and publish package

on:
  push:
    tags: ['v*']

jobs:
  package:
    # PKGBUILD pkgver cannot contain `-`; skip RC tags the same way
    # release-bakery.yml does.
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: [self-hosted]
    container:
      image: archlinux:latest
    steps:
      # Note: no actions/checkout: the archlinux image has no Node, which JS
      # actions require. Everything runs as shell steps and clones manually.
      - name: Build and publish
        env:
          PUBLISH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          pacman -Syu --noconfirm base-devel git rust cargo
          useradd -m builder
          git config --global --add safe.directory '*'
          # Exact event commit, not the mutable tag name. This job runs in its
          # own container, so /home/builder/src is already private to this job
          # and is not the shared runner workspace. Same verification as
          # scripts/ci-checkout.sh (see docs/ci-checkout.md).
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "checkout: GITHUB_SHA is not a full commit id" >&2
              exit 1
          fi
          git clone --no-checkout "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" /home/builder/src
          git -C /home/builder/src -c advice.detachedHead=false checkout --quiet --detach "${GITHUB_SHA}"
          actual="$(git -C /home/builder/src rev-parse HEAD)"
          if [ "$actual" != "${GITHUB_SHA}" ]; then
              echo "checkout: HEAD is $actual, expected ${GITHUB_SHA}" >&2
              exit 1
          fi
          cd /home/builder/src
          git archive --format=tar.gz --prefix="bakery-${VERSION}/" HEAD \
            > packaging/arch/bakery-${VERSION}.tar.gz
          SHA=$(sha256sum packaging/arch/bakery-${VERSION}.tar.gz | awk '{print $1}')
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" packaging/arch/PKGBUILD
          chown -R builder:builder /home/builder/src
          # --nocheck: packaging builds the artifact; tests belong in a CI job.
          su builder -c "cd /home/builder/src/packaging/arch && makepkg -f --noconfirm --nocheck"
          PKG=$(find /home/builder/src/packaging/arch -name '*.pkg.tar.zst' | head -1)
          curl -fsS -X PUT \
            -H "Authorization: token ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${PKG}" \
            "https://git.breadway.dev/api/packages/Breadway/arch/os"
