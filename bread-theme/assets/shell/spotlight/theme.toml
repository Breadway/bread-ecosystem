# The third compiled-in builtin (bread-theme/src/shell/builtin.rs).
#
# BAR-27 phase 1: a redesign of Spotlight, replacing the old capsule-launcher
# demo (04-spotlight.html: the bar WAS the launcher) with the floating pill
# from bos-ui-demos/proposed/spotlight-stage.html. Phase 1 is the pill only:
# workspaces, a divider, widget slots either side of the clock, a low-battery
# flag, an unread-notification dot, and auto-hide. The stage (the search/
# launcher overlay that used to live in `centre`/`drawer`) is deliberately
# NOT wired back up here; `launcher_entry`/`launcher_results` are no longer
# named in `[bar.slots]`, so breadbar still builds them (every builtin
# module is unconditional, see `bar::slots::ModuleRegistry`) but they sit
# unparented, same as `cpu`/`ram` under liquid-motion. A later phase repoints
# `centre`/`drawer` at whatever the stage turns out to need. `[launcher]`
# below is left as-is (dormant) for that phase to pick back up rather than
# deleted, since the schema still requires SOME `[launcher]` shape and this
# one is the closest match to the stage's eventual search UI.
#
# Colour: the mockup's palette is mapped to palette ROLES, never raw hex
# (bread-theme has a test rejecting raw hex in a theme's rendered CSS):
# --light (warm-white fills and text) -> `fg`, --brass (caret, mode badge,
# app names, unread dot) -> `accent`, --red (critical, armed, low battery)
# -> `red`, --ash/--line -> alpha(fg, .52)/alpha(fg, .12), --stage -> `bg`,
# --velvet/--velvet-2 -> mix(bg, fg, .07)/(.11). See base.css's spotlight
# block for the full table.
#
# Font: the mockup's `--display` (Big Shoulders Display, for the time and
# workspace numbers) is this theme's `tokens.font_family`, with Hanken
# Grotesk (the mockup's own `--ui` font) as `font_fallback` for body text.
# BAR-30 phases 2-4: Big Shoulders Display, Hanken Grotesk and Martian Mono
# (the mockup's `--mono`, for small-caps labels: the stage's mode badge,
# group headers, notification app names, the surtitle's app name, the power
# row's labels) are all installed and resolve for real now; the stage/
# surtitle CSS in base.css names Martian Mono directly on those rules
# instead of falling back to the UI font.

name = "Spotlight"
id   = "spotlight"

[tokens]
font_family    = "Big Shoulders Display"
font_fallback  = "Hanken Grotesk, sans-serif"
font_size_base = 13
radius_bar     = 999
radius_card    = 12
radius_sm      = 8
radius_pill    = 999
pad            = 14
# Demo: `.wick{background:rgba(15,13,12,.8)}`.
bg_alpha       = 0.8
spring         = "cubic-bezier(0.22, 1.2, 0.36, 1)"
spring_settle  = "cubic-bezier(0.22, 1.2, 0.36, 1)"
# The mockup's `--light` active/on-accent fill is a flat warm-white, not a
# pywal hue (phase-1 review must-fix): both ends point at `fg`, the
# ecosystem's fixed near-white foreground token, never `accent` (which
# tracks the wallpaper and drifted from the mockup's own colour). This is
# what `.workspace-btn.active` (the lit workspace chip), `.pill-ws-current-
# value` (the "WS current" mode's big number), the stage's sliders/caret-
# free selected-row fill, and every "on" chip in the stage floor resolve
# against.
accent_from    = "fg"
accent_to      = "fg"
chip_height    = 20
icon_px        = 16
# Fully rounded: `.wick{border-radius:999px}` (a 30px-tall pill), same
# "full" shape as liquid-motion's island, just pushed to a full pill by
# `radius_bar = 999` above rather than a modest corner radius.
bar_border     = "full"
# `chip_gap` spaces the bar's stat chips; the pill has none. Its own 10px
# item gap (`.wick{gap:10px}`) is breadbar's pill row spacing.
chip_gap       = 10

[bar.window]
# Anchored top ONLY, `width = "fill"`: gtk4-layer-shell centres a surface
# anchored to neither left nor right, and "fill" on a horizontal bar with no
# left/right anchor to stretch between just means "hug the content's natural
# width" (see breadbar's `Width::Fill` handling) rather than the edge-to-edge
# stretch it means on liquid-motion. That's what makes the pill's own width
# track its content (workspace count, whether widgets are on) instead of a
# fixed number.
anchors   = ["top"]
width     = "fill"
height    = 30
margin    = { top = 10 }
# No exclusive zone: windows use the full screen behind the pill.
exclusive = "none"
keyboard  = "none"
layer     = "top"

[bar.slots]
# Everything in ONE slot, not spread across left/centre/right: the pill is
# a single tight flex row (`display:flex;gap:10px` in the mockup), not three
# independently-justified groups. It has to be the CENTRE slot: the bar row
# is a GtkCenterBox, whose natural width is `centre + 2 * max(left, right)`
# so the centre child stays centred. With everything in `left` the pill
# measured twice its content's width and rendered the content in its left
# half with dead space on the right. With `left`/`right` empty the pill
# hugs its content exactly. `widget:left_of_clock`/`widget:right_of_clock`
# are the same `WidgetPlacement` aliases liquid-motion already uses for its
# own clock-flanking Lua widgets.
left   = []
# `widget:right_of_workspaces` and `widget:left_of_stats` are the bar
# placements other themes give Lua widgets beside the workspace strip and the
# system stats. The pill has no stats of its own, so both sit in its row, in
# the order the other themes' bars would put them. Widgets registered at the
# `tray` placement (the control panel's cards elsewhere) are the stage's cards.
# BAR-38: `nowplaying` (the track title while a player is playing) follows
# the time, and `dnd` (a moon while do-not-disturb is on) sits before the
# unread count.
centre = ["workspaces", "sep", "widget:right_of_workspaces", "widget:left_of_clock", "clock", "nowplaying", "widget:right_of_clock", "widget:left_of_stats", "dnd", "level", "flag", "unread"]
right  = []
drawer = []

[bar.autohide]
enabled              = true
hover_zone_width     = 420
hover_zone_height    = 14
retuck_delay_ms      = 600
notification_peek_ms = 3800
level_peek_ms        = 1400
workspace_peek_ms    = 1200

# BAR-30 phase 4: surtitles and in-pill levels replace the standalone toast/
# OSD windows every other builtin still uses. Both default to the old
# behaviour ("toast"/"window") for every theme that omits these tables, so
# this is additive-only.
[notifications]
style = "surtitle"

[osd]
style = "pill"

[modules.workspaces]
# Pill style (numbered chips, active one solid-filled), not Trail's dragged
# highlight or Dots' width-encoded row: the mockup's `.wsb` buttons are
# plain numbered chips.
style      = "pill"
# `display = "all"` (occupied workspaces plus the active one) already gets
# `show_empty = false`'s existing Pill-style filtering; `display` layers a
# `none`/`current` OVERRIDE on top for the two new modes, see
# `WorkspaceDisplay`'s own doc comment. This is the mockup's own default
# (`data-ws="all"` starts `aria-pressed="true"`).
show_empty = false
display    = "all"

[modules.clock]
# Plain, not Flip: the mockup's `.time` is one static button, no per-digit
# flip animation.
style     = "plain"
format    = "%H:%M"
show_date = false

[launcher]
# Dormant (see this file's header comment): kept at the previous pass's
# values so schema validation still has a `[launcher]` table to resolve,
# but nothing in `[bar.slots]` names `launcher_entry`/`launcher_results`
# under phase 1, so none of this actually renders yet.
mode     = "embedded"
width    = 480
top      = "16px"
radius   = 22
icon_px  = 22
row_anim = "none"
rule     = "none"
footer   = "count_apps"
sections = true
modes    = ["apps", "calc", "cmd", "url"]
search_width  = 520
search_radius = 20

# Same four satellite namespaces as before; offsets re-derived from the new
# pill edge (margin.top(10) + height(30) = 40px) the same way glass-
# workbench/liquid-motion derive theirs from their own bar's edge.
[surfaces."breadbar-notif"]
anchor = "top_right"
offset = [16, 48]
width  = 320
layer  = "overlay"

[surfaces."breadbar-osd"]
anchor = "bottom_centre"
offset = 80
width  = 180
layer  = "overlay"

[surfaces."breadbar-panel"]
anchor = "top_right"
offset = [16, 48]
width  = "auto"
layer  = "overlay"

[surfaces."breadbar-dismiss"]
anchor = "fill"
offset = 40
width  = "fill"
layer  = "overlay"

[compositor."breadbar"]
blur         = true
ignore_alpha = 0.2
blur_popups  = true
animation    = "slide top"

[compositor."breadbar-osd"]
blur         = true
ignore_alpha = 0.2
animation    = "slide bottom"

[compositor."breadbar-notif"]
blur         = true
ignore_alpha = 0.2
animation    = "slide right"

[compositor."breadbar-panel"]
blur         = true
ignore_alpha = 0.2
animation    = "slide right"

[compositor."breadbar-dismiss"]
no_anim = true

[compositor."breadbox"]
blur         = true
ignore_alpha = 0.2
no_anim      = true

# The stage, surtitle and pill hot zone are spotlight's own surfaces. Without
# a rule Hyprland gives each its default layer "popin": on the full-screen,
# translucent stage that reads as a dark box growing out of nothing. They
# animate in GTK (or not at all), so the compositor must not. BAR-38: the
# stage blurs the desktop behind its scrim, so a busy window underneath
# (htop, a terminal full of logs) stops competing with the stage's text.
[compositor."breadbar-stage"]
blur         = true
ignore_alpha = 0.2
no_anim      = true

[compositor."breadbar-surtitle"]
blur         = true
ignore_alpha = 0.2
no_anim      = true

[compositor."breadbar-pill-hotzone"]
no_anim = true

# No `css = "..."` overlay: compiled-in builtin, same as its siblings.
