[workspace]
members = ["bakery", "bread-theme", "bread-utils", "bread-onnx", "bread-screenshots", "bread-capture", "bread-app", "bread-polkit", "bread-launcher"]
resolver = "2"

[workspace.package]
version = "0.7.12"
edition = "2021"
license = "MIT"
authors = ["Breadway <plasticbread849@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
minisign-verify = "0.2"
tracing = "0.1"
semver = "1"
# Wallpaper decoding for bread-theme's native palette extractor (ECO-30).
# Only the two codecs real wallpapers need: PNG and JPEG. No jpeg-rayon
# (parallel decode isn't worth pulling in rayon for images this small once
# downscaled), no webp/tiff/avif/etc.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
