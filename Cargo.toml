[workspace]
members = ["bakery", "bread-theme", "bread-palette-extract", "bread-utils", "bread-onnx", "bread-screenshots", "bread-capture", "bread-app", "bread-polkit", "bread-launcher"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
authors = ["Breadway <plasticbread849@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
minisign-verify = "0.2"
tracing = "0.1"
semver = "1"
# Wallpaper decoding for bread-palette-extract's native palette extractor
# (ECO-30), bread-theme's optional `extract` feature: the formats breadpaper
# accepts (png, jpg/jpeg, webp, gif, bmp). No jpeg-rayon (parallel decode is
# not worth pulling in rayon here).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
